plugins {
    id 'com.android.application'
}

base {
    archivesName.set("RosKasa")
}

def versionPropsFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionPropsFile.canRead()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
} else {
    versionProps['VERSION_MAJOR'] = '1'
    versionProps['VERSION_MINOR'] = '0'
    versionProps['VERSION_PATCH'] = '0'
    versionProps['VERSION_CODE'] = '1'
}

def isReleaseBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

int vMajor = versionProps['VERSION_MAJOR'].toInteger()
int vMinor = versionProps['VERSION_MINOR'].toInteger()
int vPatch = versionProps['VERSION_PATCH'].toInteger()
int vCode = versionProps['VERSION_CODE'].toInteger()

if (isReleaseBuild) {
    vCode += 1
    vPatch += 1
    versionProps['VERSION_CODE'] = vCode.toString()
    versionProps['VERSION_PATCH'] = vPatch.toString()
    versionPropsFile.withWriter { versionProps.store(it, 'Auto-incremented on release build') }
}

android {
    namespace 'si.ros.RosKasa'
    compileSdk 36

    defaultConfig {
        applicationId "si.ros.RosKasa"
        minSdk 26
        targetSdk 36
        versionCode vCode
        versionName "${vMajor}.${vMinor}.${vPatch}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ksoap2-android for SOAP WSDL communication
    implementation 'com.google.code.ksoap2-android:ksoap2-android:3.6.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
